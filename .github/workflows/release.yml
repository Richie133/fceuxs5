# Builds fceuxs5 from source and publishes the GitHub release a tag names.
# Push a tag named after the app's contentVersion (sce_sys/param.json), e.g. 01.000.000, or run it by hand
# (Actions > release > Run workflow) with that tag.
name: release

on:
  push:
    tags: ['[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (the contentVersion, e.g. 01.000.000)'
        required: true
        default: '01.000.000'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Toolchain (clang / lld 18)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-18 lld-18 llvm-18 zip
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          for t in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-ranlib llvm-strip; do
            sudo ln -sf /usr/lib/llvm-18/bin/$t /usr/local/bin/$t
          done
          clang --version | head -1

      - name: ps5-payload-sdk v0.42
        run: |
          curl -sSfL -o sdk.zip https://github.com/ps5-payload-dev/sdk/releases/download/v0.42/ps5-payload-sdk.zip
          echo "8cfbc7cd5811e719eb4f0c47eea668d3dc7b40bc8ab11c4a5031d40c23ec02da  sdk.zip" | sha256sum -c
          sudo unzip -q sdk.zip -d /opt
          ls /opt/ps5-payload-sdk/bin | head

      - name: Build the app, the installer and the release zip
        run: make -C ps5 dist -j"$(nproc)"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -l ps5/build/dist
          gh release create "$TAG" ps5/build/dist/*-PPSA*.zip ps5/build/dist/fceuxs5-v*[0-9].elf \
            --title "fceuxs5 $TAG" --notes-file .github/release-notes.md --verify-tag
